<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052e16" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#leafGrad)" stroke-width="8" opacity="0.4"/>

  <!-- Glowing Leaf Background Motif -->
  <path d="M 256 90 C 350 90, 420 160, 420 256 C 420 350, 350 420, 256 420 C 160 420, 90 350, 90 256 C 90 160, 160 90, 256 90 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.15" />

  <!-- Geometric MK Emblem -->
  <g filter="url(#glow)">
    <!-- M shape -->
    <path d="M 120 370 L 120 150 L 200 280 L 256 180 L 312 280 L 392 150 L 392 370" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Nature Leaf Accent over the peak -->
    <path d="M 256 120 C 280 120 310 140 310 170 C 280 180 256 160 256 120 Z" fill="url(#leafGrad)"/>
  </g>
</svg>
