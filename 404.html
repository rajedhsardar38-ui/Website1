<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Page Not Found - MK Studio</title>
  <meta name="description" content="The page you are looking for could not be found." />
  <meta name="theme-color" content="#03140e" />

  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; justify-content: center; align-items: center; text-align: center;">

  <canvas id="bgCanvas"></canvas>

  <main class="container" style="max-width: 600px; padding: 40px 20px;">
    <div class="glass-card fade-in-up" style="padding: 50px 30px;">
      
      <div style="font-family: var(--font-display); font-size: 6rem; font-weight: 800; color: var(--primary-glow); line-height: 1;">
        404
      </div>

      <h1 style="font-family: var(--font-display); font-size: 1.8rem; margin: 16px 0;">Page Not Found</h1>
      
      <p style="color: var(--text-muted); font-size: 1rem; margin-bottom: 30px;">
        Oops! The page or APK link you were looking for doesn't exist or has been moved to a new GitHub Release path.
      </p>

      <a href="index.html" class="btn btn-primary" style="padding: 14px 28px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>Return to Homepage</span>
      </a>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
